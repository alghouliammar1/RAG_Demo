[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ocr-rag-demo"
version = "0.1.0"
description = "A learning project for OCR-powered retrieval-augmented generation"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
ocr = [
    "Pillow>=10.0",
    "PyMuPDF>=1.24",
    "pypdf>=4.0",
    "pytesseract>=0.3.10",
]
vectors = [
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
]
llm = [
    "openai>=1.30",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100